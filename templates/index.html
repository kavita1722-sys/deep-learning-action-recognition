<!--
===============================================================================
===============================================================================

This HTML file is the main user interface of my Human Action Recognition
web application built using Flask. It allows a user to upload a video or
open the live webcam for AI-based action detection.

-------------------------------
1. PAGE STRUCTURE
-------------------------------
The page contains three main sections:

1) Title Section
   - Displays the project title: "Explainable Human Action Recognition with CNN-LSTM"
   - Uses Bootstrap styling and custom CSS for better UI appearance.

2) Upload Section
   - Allows users to upload a video file.
   - The form sends a POST request to the Flask backend.
   - After uploading, the backend processes the video and returns the file name.

3) Video Display Section
   - Only appears if a video has been uploaded.
   - Displays the processed video player.
   - Includes an AI prediction overlay that shows:
        • Detected Action
        • Confidence Score
        • Explanation of prediction

-------------------------------
2. STYLING (CSS)
-------------------------------
I designed the UI to be simple but visually modern.

Key design elements:

• Gradient background for better aesthetics.
• Upload card and video card with shadows and rounded corners.
• Responsive video container that fits any video resolution.
• Object-fit: contain ensures the video scales without distortion.
• Overlay box shows AI prediction on top of the video.

Main CSS Components:
- .upload-card : UI box for uploading videos
- .video-card  : container for displaying processed video
- .video-container : keeps video centered and responsive
- .ai-video : video player styling
- #predictionOverlay : displays AI prediction text

-------------------------------
3. VIDEO PREDICTION OVERLAY
-------------------------------
The overlay is positioned using:

position: absolute

This places the prediction box on top of the video player.

It shows:
Action detected
Confidence score
Explanation

This is useful for explainable AI visualization.

-------------------------------
4. JAVASCRIPT FRAME CAPTURE
-------------------------------
The script performs real-time prediction on video frames.

Steps performed:

1) Access the video element
2) Create an invisible canvas
3) Every 400ms:
      - Capture the current video frame
      - Convert the frame to a JPEG blob
      - Send the frame to Flask backend using fetch()

Endpoint used:
    /predict_frame

The backend returns JSON containing:

{
    action: predicted action label
    confidence: probability score
    explanation: explanation from model
}

-------------------------------
5. OVERLAY UPDATE
-------------------------------
After receiving the response:

overlay.innerHTML is updated with:
    Action
    Confidence
    Explanation

Example display:

Action: Punch
Confidence: 93%
Important joints detected: Arms & shoulders movement

This gives the user real-time AI feedback.

-------------------------------
6. ERROR HANDLING
-------------------------------
If the backend fails or connection is lost,
the overlay displays:

"AI Prediction Error"

This prevents the UI from breaking.

-------------------------------
7. RESPONSIVE VIDEO DESIGN
-------------------------------
The video container uses:

width: 90vw
height: 60vh

This ensures:
• Videos of any resolution display properly
• The player adjusts to different screen sizes

-------------------------------
8. LIVE WEBCAM OPTION
-------------------------------
The button:

/webcam

opens a separate Flask route where
live webcam action recognition runs.

This supports real-time detection without uploading a video.

-------------------------------
9. WHY I BUILT IT THIS WAY
-------------------------------
This design allows:

• Easy video upload
• Real-time frame-based prediction
• Clear visualization of model output
• Explainable AI results
• Smooth and responsive UI

The combination of:

Flask + JavaScript + Canvas + CNN-LSTM model

makes the system interactive and suitable for demonstrating
Explainable Human Action Recognition.

===============================================================================
===============================================================================
-->
<!DOCTYPE html>
<html>

<head>

<title>Explainable Human Action Recognition with CNN-LSTM</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background: linear-gradient(135deg,#f8ffae,#43c6ac);
min-height:100vh;
font-family: "Segoe UI", sans-serif;
}

.title{
font-weight:700;
font-size:38px;
color:#2c3e50;
margin-bottom:30px;
}

.upload-card{
background:white;
border-radius:15px;
padding:30px;
box-shadow:0 10px 30px rgba(0,0,0,0.15);
}

.video-card{
background:white;
border-radius:15px;
padding:25px;
box-shadow:0 10px 30px rgba(0,0,0,0.15);
margin-top:30px;
}

.btn-custom{
background:#27ae60;
border:none;
padding:10px 25px;
font-weight:600;
color:white;
transition:0.3s;
}

.btn-custom:hover{
background:#1e8449;
transform:scale(1.05);
}

/* VIDEO CONTAINER - FITS ANY VIDEO TYPE */

.video-container{
position:relative;
display:flex;
justify-content:center;
align-items:center;
width:90vw;
height:60vh;
max-width:1000px;
margin:auto;
overflow:hidden;
border-radius:12px;
}

/* VIDEO FITS SCREEN */

.ai-video{
width:100%;
height:100%;
object-fit:contain;
border-radius:12px;
box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

/* AI PREDICTION OVERLAY */

#predictionOverlay{
position:absolute;
top:20px;
left:20px;
background:rgba(0,0,0,0.6);
color:white;
padding:10px 15px;
border-radius:8px;
font-weight:600;
font-size:18px;
}

</style>

</head>

<body>

<div class="container py-4">

<h1 class="text-center title">
Explainable Human Action Recognition with CNN-LSTM
</h1>

<div class="upload-card mx-auto" style="max-width:700px">

<form method="POST" enctype="multipart/form-data">

<label class="form-label mb-2">Upload Video</label>

<input class="form-control mb-3" type="file" name="video" required>

<button class="btn btn-custom">
Upload & Start AI Detection
</button>

<br><br>

<a href="/webcam" class="btn btn-primary">
Open Live Webcam
</a>

</form>

</div>

{% if video_file %}

<div class="video-card text-center mx-auto" style="max-width:1100px">

<h4 class="mb-3">Uploaded Video (AI Processed)</h4>

<div class="video-container">

<video id="videoPlayer" class="ai-video" controls>
<source src="{{ url_for('static', filename='uploads/' + video_file) }}">
</video>

<div id="predictionOverlay">
Action: Detecting...
</div>

</div>

</div>

{% endif %}

</div>


<script>

const video = document.getElementById("videoPlayer")
const overlay = document.getElementById("predictionOverlay")

if(video){

const canvas = document.createElement("canvas")
const ctx = canvas.getContext("2d")

setInterval(async () => {

if(video.paused || video.ended) return

canvas.width = video.videoWidth
canvas.height = video.videoHeight

ctx.drawImage(video,0,0)

canvas.toBlob(async blob => {

let formData = new FormData()
formData.append("frame", blob)

try{

let response = await fetch("/predict_frame",{
method:"POST",
body:formData
})

let data = await response.json()

overlay.innerHTML =
`Action: ${data.action}<br>
Confidence: ${data.confidence}%<br>
${data.explanation}`

}catch(error){

overlay.innerHTML = "AI Prediction Error"

}

}, "image/jpeg")

},400)

}

</script>

</body>

</html>
